name: any-to-omada

services:
  any-to-omada:
    build:
      context: .
      dockerfile: Dockerfile
    image: any-to-omada:0.3.0
    restart: unless-stopped
    # Replace the host-side loopback address with the intended LAN address
    # before connecting a router/NVR. One published pair per virtual camera.
    # The control API on container loopback 19031 must remain unpublished.
    ports:
      - "127.0.0.1:18443:18443/tcp"
      - "127.0.0.1:18554:18554/tcp"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - type: bind
        source: ./config
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: any-to-omada-data
        target: /data
      # Create this private directory even for the all-disabled example.
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  any-to-omada-data:
